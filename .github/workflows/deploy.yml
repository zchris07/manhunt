name: Deploy to GitHub Pages

# Builds the static client and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_PEER_HOST / VITE_PEER_PORT / VITE_PEER_PATH / VITE_PEER_SECURE  (self-hosted signaling)
#   VITE_TURN_URL / VITE_TURN_USERNAME                                    (TURN relay)
# and the secret VITE_TURN_CREDENTIAL. With nothing set, the public PeerJS broker and public
# STUN servers are used.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_PEER_HOST: ${{ vars.VITE_PEER_HOST }}
          VITE_PEER_PORT: ${{ vars.VITE_PEER_PORT }}
          VITE_PEER_PATH: ${{ vars.VITE_PEER_PATH }}
          VITE_PEER_SECURE: ${{ vars.VITE_PEER_SECURE }}
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
